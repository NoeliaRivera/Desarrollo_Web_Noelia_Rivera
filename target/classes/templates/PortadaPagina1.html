<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC: PROTOTYPE FRONTPAGE</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        nav { background: #f4f4f4; padding: 15px; border: 1px solid #ccc; }
        nav button { margin-right: 15px; cursor: pointer; } /* Añadido cursor pointer */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
    <h1>DCC Ingeniería UChile</h1>
    <h2>Bienvenido al Portal de Actividades</h2>

    <nav>
        <button th:onclick="|window.location.href='@{/registro}'|">
            Registrar miembro
        </button>

        <button th:onclick="|window.location.href='@{/miembros}'|">
            Ver listado
        </button>

        <button th:onclick="|window.location.href='@{/estadisticas}'|">
            Estadísticas
        </button>

        <button th:onclick="|window.location.href='@{/actividades}'|">
            Ver actividades registradas
        </button>

    </nav>

    <h3>Últimos 5 registrados</h3>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Actividad</th>
                <th>Tipo</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(ultimos)}">
                <td colspan="4">No hay miembros registrados</td>
            </tr>

            <tr th:each="m : ${ultimos}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.correo}"></td>

                <td th:text="${m.actividades != null and !m.actividades.isEmpty()} 
                ? ${m.actividades[0].nombreActividad} : 'Sin actividad'">
                </td>

                <td th:text="${m.actividades != null and !m.actividades.isEmpty()} 
                ? ${m.actividades[0].tipo} : '-'">
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
