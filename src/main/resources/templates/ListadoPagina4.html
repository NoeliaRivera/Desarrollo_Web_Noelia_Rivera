<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DCC: PROTOTYPE USERS LIST</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        h1 {
            margin-bottom: 0;
        }

        h2 {
            margin-top: 5px;
            color: #555;
        }

        .volver {
            margin-top: 20px;
        }

    </style>

</head>

<body>
    <div th:replace="~{fragment/navbar :: navbar}"></div>
    <h1>DCC Ingeniería UChile</h1>
    <h2>Miembros registrados</h2>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Tipo de Miembro</th>
                <th>Contacto</th>
                <th>Actividad Principal</th>
                <th>Tipo de Actividad</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="m : ${miembros}">
                <td th:text="${m.nombre}"></td>
                <td th:text="${m.tipo}"></td>
                <td>
                    <span th:text="${m.correo}"></span>
                    <br>
                    <span th:text="${m.telefono}"></span>
                </td>
                <td th:text="${m.actividades != null and !m.actividades.isEmpty()} ? ${m.actividades[0].nombreActividad} : '-'"></td>
                <td th:text="${m.actividades != null and !m.actividades.isEmpty()} ? ${m.actividades[0].tipo} : '-'"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
